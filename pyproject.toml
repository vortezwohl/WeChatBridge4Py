[project]
name = "wechatbridge4py"
version = "0.2.0"
description = "微信「合并转发」→ Python 回调：自定义品牌的 Share Target 收件箱 SDK（纯 SDK，无 CLI）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "WeChatBridge4Py contributors" },
]
keywords = ["wechat", "share-target", "msix", "chat-export", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ruff>=0.17.3",
    "winrt-windows-applicationmodel>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel-activation>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel-datatransfer>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel-datatransfer-sharetarget>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-management-deployment>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-storage>=4!10.0.28000.2705 ; sys_platform == 'win32'",
]

# SDK-only：唯一的入口点是系统分享契约激活的二进制（非用户 CLI）。
[project.gui-scripts]
wcb4py-share = "wechatbridge4py.windows.activation:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 完整 pycodestyle（E/W，含 E501 行宽）+ pyflakes（F）= PEP 8 检查面。
select = ["E", "W", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
