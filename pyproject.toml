[project]
name = "wechatbridge4py"
version = "0.1.0"
description = "微信「合并转发」→ Python 回调：Share Target 收件箱桥接基础设施（不预设任何目标应用）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "WeChatBridge4Py contributors" },
]
keywords = ["wechat", "share-target", "msix", "chat-export", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "winrt-windows-applicationmodel>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel-activation>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel-datatransfer>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-applicationmodel-datatransfer-sharetarget>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-management-deployment>=4!10.0.28000.2705 ; sys_platform == 'win32'",
    "winrt-windows-storage>=4!10.0.28000.2705 ; sys_platform == 'win32'",
]

[project.scripts]
wcb4py = "wechatbridge4py.cli:main"

[project.gui-scripts]
wcb4py-share = "wechatbridge4py.win.activation:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
